# Builds the Android TV app and publishes it as a GitHub release, so the TV can
# download it directly from:
#   https://github.com/<owner>/<repo>/releases/latest/download/bravia-dashboard.apk
name: Build TV app

on:
  push:
    paths:
      - "index.html"
      - "css/**"
      - "js/**"
      - "android/**"
      - ".github/workflows/build-tv-app.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk bravia-dashboard.apk

      - uses: actions/upload-artifact@v4
        with:
          name: bravia-dashboard
          path: bravia-dashboard.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Dashboard build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: bravia-dashboard.apk
          body: |
            Built from ${{ github.ref_name }} @ ${{ github.sha }}.
            Install on the TV with the Downloader app using:
            https://github.com/${{ github.repository }}/releases/latest/download/bravia-dashboard.apk
