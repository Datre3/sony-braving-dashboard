<!doctype html>
<!-- Launcher icon (48x48 dp). Edit, then run: node render.js -->
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; width: 48px; height: 48px; overflow: hidden; }
  body { background: #0b0f17; display: grid; place-items: center; }
  .grid { display: grid; grid-template-columns: 17px 11px; grid-template-rows: 11px 17px; gap: 3px; }
  .grid div { border-radius: 3px; }
  .a { background: #4f9dff; } .b { background: #c4302b; }
  .c { background: #1a7f43; } .d { background: #f2f4f8; }
</style></head><body>
  <div class="grid"><div class="a"></div><div class="b"></div><div class="c"></div><div class="d"></div></div>
</body></html>
