<!doctype html>
<!-- Home-screen banner tile (320x180 dp). Edit, then run: node render.js -->
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; width: 320px; height: 180px; overflow: hidden; }
  body {
    background: radial-gradient(circle at 85% 0%, #24406e 0%, #0b0f17 70%);
    font-family: "Roboto", "Segoe UI", system-ui, sans-serif;
    color: #f2f4f8;
    display: flex; align-items: center; gap: 18px; padding: 0 24px;
    box-sizing: border-box;
  }
  .grid { display: grid; grid-template-columns: 40px 26px; grid-template-rows: 26px 40px; gap: 6px; flex: none; }
  .grid div { border-radius: 7px; }
  .a { background: #4f9dff; } .b { background: #c4302b; }
  .c { background: #1a7f43; } .d { background: #f2f4f8; }
  h1 { margin: 0; font-size: 34px; font-weight: 500; letter-spacing: -.01em; line-height: 1; }
  p { margin: 8px 0 0; font-size: 14px; color: #8b95a8; letter-spacing: .14em; text-transform: uppercase; }
</style></head><body>
  <div class="grid"><div class="a"></div><div class="b"></div><div class="c"></div><div class="d"></div></div>
  <div><h1>Dashboard</h1><p>Living room</p></div>
</body></html>
