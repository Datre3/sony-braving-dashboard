<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Living Room Dashboard</title>
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <header class="topbar">
    <div class="greeting" id="greeting">Hello</div>
    <div class="status" id="status"></div>
  </header>

  <main class="grid" id="grid">
    <!-- Cards are rendered from js/config.js -->
  </main>

  <footer class="hint">◀ ▲ ▼ ▶ to move · OK to open</footer>

  <section class="overlay" id="all-apps" hidden>
    <h1 class="overlay-title">All apps</h1>
    <div class="apps-grid" id="apps-grid"></div>
  </section>

  <script src="js/fit.js"></script>
  <script src="js/config.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/allapps.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
